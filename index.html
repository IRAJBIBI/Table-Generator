<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
            <div id="Container">
                
                
                

                <h1>Table Generator</h1>
                <input type="number" id="number" name="number" placeholder="Enter any number:">
                <br>
                <input type="number" id="length" name="length"placeholder="Enter length of table:">
                <br>
                <button id="button">Generate</button>
                <textarea id="textarea"
                rows="10"  cols="20"  placeholder="Your Table appears here!"></textarea>

                <button id="reset" name="reset">Reset</button>

                

            </div>

            <script src="script.js"></script>
</body>
</html>
